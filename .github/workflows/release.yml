name: Release

on:
  push:
    branches: [main]
  # Re-open the versioning PR by hand, e.g. after fixing a repository setting.
  workflow_dispatch:

permissions:
  contents: write # the Version Packages PR and the GitHub release
  pull-requests: write
  id-token: write # npm provenance

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    if: github.repository == 'Goya-24/goya24-js'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check the npm token
        # Fail here, in words, rather than four times inside the publish with
        # a 404 that does not say "token". Prints who the token is and what
        # it may publish; neither is a secret.
        run: |
          # Shape only, never the value: an empty secret and a pasted newline
          # both look like "invalid token" from the outside.
          echo "secret length: ${#NPM_TOKEN}, starts with: ${NPM_TOKEN:0:4}, whitespace inside: $([[ "$NPM_TOKEN" =~ [[:space:]] ]] && echo yes || echo no)"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          echo "token belongs to: $(npm whoami)"
          echo "organizations:"; npm org ls goya24 --json || echo "(not a member of goya24, or the token cannot read it)"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the Version Packages PR, or publish
        # With pending changesets this opens/updates the versioning PR. With
        # none (that PR was just merged) it builds and publishes what changed,
        # signed with provenance, and tags the release.
        uses: changesets/action@v1
        with:
          # Not `pnpm version`: that name is pnpm's own command, which would run
          # instead of the script and change nothing.
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
