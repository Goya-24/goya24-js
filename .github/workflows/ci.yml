name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # The version comes from `packageManager` in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
        if: matrix.node == 20

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - run: pnpm build

      - name: Bundle size
        if: matrix.node == 20
        run: pnpm size

      - name: Public API report
        # The built types must match api/*.d.ts. A change there is a change
        # users can feel; it is reviewed as one, and named in a changeset.
        if: matrix.node == 20
        run: pnpm api:check

      - name: What npm would ship
        # publint checks the package.json a consumer sees; attw packs each
        # package and resolves it the way node10, node16 and bundlers do.
        if: matrix.node == 20
        run: pnpm publish:check

      - uses: codecov/codecov-action@v4
        if: matrix.node == 20
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  examples:
    name: Build the examples
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm examples:build
