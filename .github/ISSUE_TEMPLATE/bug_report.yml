name: Bug report
description: Something does not do what the README says it does.
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@goya24/react 0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Framework, browser and OS
      placeholder: "Next.js 15 (App Router), Chrome 130 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest page or component that shows it. A StackBlitz or a repo link is best.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Anything `[dastyar24]` or `@goya24/…` printed.
      render: text
