name: Feature request
description: Something the SDK should let you do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation on your site, not the API you imagine. We may know a shorter way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the SDK to offer?
